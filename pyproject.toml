[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "findyou"
version = "0.1.0"
description = "Evidence-grounded personal memory and read-only social agent backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<3", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "typer>=0.15,<1", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
bilibili = ["bili-agent==1.2.1"]

[project.scripts]
findyou = "findyou.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/findyou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires explicitly configured real credentials"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
